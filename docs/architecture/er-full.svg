тветствие lead_keys и истории отправки.</text><text x="30" y="950" text-anchor="start" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#AD453B">fetch_runs/fetch_log — сводные журналы без FK на отдельный контракт. FK-проверка сейчас выключена.</text></svg>